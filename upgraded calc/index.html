
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <h1>Smart Calculator</h1>
        <p class="subtitle">Simple calculations, smarter results.</p>

        <div class="input-group">
            <input type="number" id="num1" step="any" placeholder="First number">
            <input type="number" id="num2" step="any" placeholder="Second number">
        </div>

        <div class="button-group">
            <button data-operation="add">+</button>
            <button data-operation="subtract">-</button>
            <button data-operation="multiply">*</button>
            <button data-operation="divide">÷</button>
            <button data-operation="modulus">Mod</button>
            <button data-operation="percentage">% of</button>
            <button data-operation="squareRoot">√</button>
            <button data-operation="cubeRoot">∛</button>
            <button data-operation="square">x²</button>
            <button data-operation="cube">x³</button>
            <button data-operation="factorial">n!</button>
            <button data-operation="power">xʸ</button>
        </div>

        <div class="result-box">
            <p>YOUR RESULT</p>
            <h2 id="result" aria-live="polite">0</h2>
        </div>

        <button id="clearBtn" class="clear-btn">Clear All</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
